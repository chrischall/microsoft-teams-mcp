version: 1
name: Microsoft Teams
slug: teams
summary: >-
  Microsoft Teams for Claude — read any chat or channel, your unread
  messages, and their attachments, and send messages and reactions (each
  confirmed first), via your signed-in browser session
#
# Hosting note (a comment, not user-facing summary text): every tool — chats,
# channels and the Activity feed (conversation 48:notifications) — reads
# through Teams' chat-service REST API with plain server-side fetches to
# teams.cloud.microsoft. Nothing reads the page. But the bearer token they
# need can only come from a signed-in Teams tab (captured through the
# fetchproxy BROWSER BRIDGE; it lasts ~23h), so a hosted registration that is
# expected to keep working without a hand-supplied TEAMS_ACCESS_TOKEN needs
# the bridge — for one header capture a day, never on the request path.
#
# A bridged registration needs `runtime: fly-shared`, `bridge: true` and a
# `bridgePortEnv`, which are REGISTRATION fields this manifest has no schema
# for — set them over the control API (PUT on the registration id, per
# mcp-host's BROWSER-BRIDGE.md), naming TEAMS_WS_PORT below as the port
# variable. `state.dataDir` below is required for `bridge`.
#
# Credentials here are PER PERSON — this reads someone's work chats — so a
# real deployment wants identity.perUserChild with TEAMS_ACCESS_TOKEN as an
# auth field, never one operator's token shared via --secret-env.
env:
  - name: TEAMS_WS_PORT
    required: false
    help: >-
      fetchproxy concentrator port used for the browser bridge. Defaults to
      37149, the fleet-wide shared port. Name this variable in the
      registration's bridgePortEnv for a bridged deployment.
  - name: TEAMS_ACCESS_TOKEN
    secret: true
    required: false
    help: >-
      Pre-obtained Teams chat-service bearer token. Overrides browser capture.
      Power users / CI only; tokens last about 23 hours. With it set, no tool
      needs the bridge.
  - name: TEAMS_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 'true' to disable browser token capture, requiring
      TEAMS_ACCESS_TOKEN.
  - name: TEAMS_CHATSVC_REGION
    required: false
    help: >-
      Chat-service region in the API path. Defaults to amer.
  - name: TEAMS_CHATSVC_BASE
    required: false
    help: >-
      Override the chat-service base URL. Defaults to
      https://teams.cloud.microsoft/api/chatsvc/<region>/v1.
  - name: TEAMS_CAPTURE_TIMEOUT
    required: false
    help: >-
      Seconds to wait for the Teams tab to make a chat-service request we can
      read a token from. Defaults to 30.
  - name: TEAMS_TOKEN_CACHE
    required: false
    help: >-
      Set to 'false' to stop caching the captured token between runs. Defaults
      to true.
  - name: TEAMS_TOKEN_FILE
    required: false
    help: >-
      Path to the cached token file. Defaults to
      ~/.microsoft-teams-mcp/token.json.
  - name: TEAMS_TIME_ZONE
    required: false
    help: >-
      Default IANA time zone (e.g. America/New_York) for the tz argument of
      the read tools; messages then carry time_local. Unset means UTC only.
  - name: TEAMS_OUTPUT_DIR
    required: false
    help: >-
      Folder teams_export writes exports into (each export gets its own
      subfolder). Unset means ~/Downloads/microsoft-teams-mcp.
  - name: TEAMS_SUBSTRATE_TOKEN_FILE
    required: false
    help: >-
      Path to the cached Substrate search token file. Defaults to
      ~/.microsoft-teams-mcp/substrate-token.json.
  - name: TEAMS_SHAREPOINT_TOKEN_FILE
    required: false
    help: >-
      Path to the cached SharePoint token file (one token per SharePoint host,
      used to download shared files). Defaults to
      ~/.microsoft-teams-mcp/sharepoint-tokens.json.
state:
  dataDir: true
  reason: >-
    Caches the captured bearer token at ~/.microsoft-teams-mcp/token.json
    (0600) and holds the fetchproxy identity keypair under
    ~/.fetchproxy/identity. Without persistence every cold start re-captures
    from the browser and mints a fresh identity — re-prompting pairing in the
    user's browser, which on a scale-to-zero machine means constantly.
egress:
  # teams.cloud.microsoft serves the chat-service API (src/chatsvc.ts). Inline
  # images download from Teams' image store on a regional *.asm.skype.com host
  # (us-api.asm.skype.com and the like), retried through the Teams gateway
  # (us-prod.asyncgw.teams.microsoft.com) when the store cannot be reached —
  # the client sends its token nowhere else. Message search goes to Microsoft
  # Substrate (src/substrate.ts) with its own token. Shared files
  # (teams_get_attachment) download from the file's SharePoint tenant host
  # (<tenant>.sharepoint.com / <tenant>-my.sharepoint.com, src/sharepoint.ts):
  # the authed driveItem GET and then its pre-signed @content.downloadUrl,
  # which SharePoint issues on the same tenant host (download.aspx + tempauth).
  # That the pre-signed link never redirects off *.sharepoint.com has not been
  # confirmed on a live fenced download; if it does, the refusal now names the
  # host it was refused (src/network-error.ts), and that host belongs here.
  allow:
    - teams.cloud.microsoft
    - '*.asm.skype.com'
    - us-prod.asyncgw.teams.microsoft.com
    - substrate.office.com
    - '*.sharepoint.com'
# Sample prompts for the public catalog — each is answered by the read tools
# alone (teams_list_unread_messages, teams_search_messages, teams_list_activity), and none
# marks anything read.
examples:
  - prompt: >-
      Catch me up on my unread Teams messages and tell me which ones need a
      reply from me.
    note: Reads unread chats and channels; nothing is marked read.
  - prompt: >-
      Search my Teams chats from the last two weeks for messages about the
      quarterly budget review.
    note: Uses the same search the Teams search box does.
  - prompt: What mentions and replies have I had in my Teams Activity feed today?
